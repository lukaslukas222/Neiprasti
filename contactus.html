<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footer Example</title>
    <link rel="stylesheet" href="style/contactus.css">
</head>

<body>

    <div class="footer-container">
        <footer class="footer">
            <div class="footer-logo">
                <img src="IMG/image.png" alt="Donila Logo" class="logo-icon" />
            </div>

            <h3><a href="contact.html" class="contact-title">CONTACT US</h3>

            <div class="footer-contacts">
                <div class="contact-item">
                    <img src="IMG/map.png" alt="">

                    <span class="icon"></span>

                    <a href="index.html">Location</a>
                </div>
                <div class="contact-item">
                    <span class="icon"></span>
                    <img src="IMG/call.png" alt="Call Icon">
                    <span><a href="index.html">Call +01 1234567890</a></span>
                </div>
                <div class="contact-item">
                    <span class="icon"></span>
                    <img src="IMG/sms3.png" alt="Email Icon">
                    <span><a href="index.html">demo@gmail.com</a></span>
                </div>
            </div>

            <div class="footer-bottom">
                <p>© 2020 All Rights Reserved. Free html Templates</p>
            </div>
        </footer>
    </div>

</body>

</html>
